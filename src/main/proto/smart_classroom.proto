
syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.nci.smartclassroom.smartclassroomsystem";
option java_outer_classname = "SmartClassroomServiceImpl";

package smartclassroom;

service StudentEngagementService {
  rpc TrackAttendance (AttendanceRequest) returns (AttendanceResponse);
  rpc MonitorEngagement (EngagementRequest) returns (stream EngagementResponse);
}

service SmartResourceService {
  rpc CheckResourceAvailability (ResourceCheckRequest) returns (ResourceCheckResponse);
  rpc RequestResources (stream ResourceRequest) returns (ResourceSummaryResponse);
}

service CollaborationService {
  rpc FindTutor (TutorRequest) returns (stream TutorResponse);
  rpc CoordinateStudyGroup (stream GroupMessage) returns (stream GroupUpdate);
}

message AttendanceRequest {
  string student_id = 1;
  string class_id = 2;
  string timestamp = 3;
}

message AttendanceResponse {
  bool present = 1;
  string message = 2;
  string recorded_time = 3;
}

message EngagementRequest {
  string class_id = 1;
  string class_name = 2;
}

message EngagementResponse {
  string student_id = 1;
  double attention_score = 2;
  int32 participation_count = 3;
  int32 engagement_level = 4;
  string timestamp = 5;
}

message ResourceCheckRequest {
  string resource_name = 1;
  string resource_type = 2;
  string location = 3;
}

message ResourceCheckResponse {
  bool available = 1;
  int32 quantity = 2;
  string location = 3;
  string estimated_wait_time = 4;
}

message ResourceRequest {
  string resource_id = 1;
  string resource_name = 2;
  int32 quantity = 3;
  string priority = 4;
  string requester_id = 5;
}

message ResourceSummaryResponse {
  int32 items_available = 1;
  int32 items_pending = 2;
  string message = 3;
  repeated string fulfilled_items = 4;
}

message TutorRequest {
  string subject = 1;
  string topic = 2;
  string student_id = 3;
  int32 max_distance = 4;
}

message TutorResponse {
  string tutor_id = 1;
  string name = 2;
  string expertise = 3;
  double rating = 4;
  int32 sessions_completed = 5;
  bool available = 6;
  string contact_info = 7;
}

message GroupMessage {
  string student_id = 1;
  string group_id = 2;
  string message_type = 3;
  string content = 4;
  string timestamp = 5;
}

message GroupUpdate {
  string group_id = 1;
  string update_type = 2;
  string message = 3;
  string sender = 4;
  string timestamp = 5;
}